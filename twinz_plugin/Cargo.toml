[package]
name = "twinz_plugin"
version = "0.1.0"
edition = "2021"

[features]
default = ["builtin-kv"]
builtin-kv = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
twinz_transport = { workspace = true }
twinz_storage = { workspace = true }
twinz_core = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = "14.0" # Stable version for Wasm integration
wasmtime-wasi = "14.0"
tokio = { workspace = true }

