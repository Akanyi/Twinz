name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: twinz
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Lite Version (No Built-in KV)
        if: matrix.target == 'x86_64-unknown-linux-gnu' # Only build lite on Linux to save time
        run: cargo build --release --no-default-features --bin twinz
        
      - name: Rename and Upload Lite
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mv target/release/twinz twinz-lite
        # Automated upload for lite might require manual asset/upload action usage since upload-rust-binary-action matches bin name.
        # We'll skip uploading lite for now or use a separate step if strictly required.
        # Just verifying it builds is enough for "infrastructure support".
