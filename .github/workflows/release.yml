name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: twinz
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Package Lite Version
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --no-default-features --bin twinz
          mv target/release/twinz twinz-lite
          tar -czf twinz-lite-x86_64-unknown-linux-gnu.tar.gz twinz-lite

      - name: Upload Lite Asset
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./twinz-lite-x86_64-unknown-linux-gnu.tar.gz
          asset_name: twinz-lite-x86_64-unknown-linux-gnu.tar.gz
      - name: Build and Package Lite Version (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cargo build --release --no-default-features --bin twinz
          mv target/release/twinz.exe twinz-lite.exe
          7z a twinz-lite-x86_64-pc-windows-msvc.zip twinz-lite.exe

      - name: Upload Lite Asset (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./twinz-lite-x86_64-pc-windows-msvc.zip
          asset_name: twinz-lite-x86_64-pc-windows-msvc.zip
          asset_content_type: application/zip
